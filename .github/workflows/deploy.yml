name: Deploy to seohost

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set net:timeout 30;
            set net:max-retries 3;
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            open -u srv104971,$FTP_PASSWORD ftp://h96.seohost.pl;
            mirror --reverse --delete --verbose \
              ./meritoros-theme/ \
              /public_html/wp-content/themes/meritoros-theme/
          "
