name: Deploy to seohost

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Get changed files
        id: changed
        run: |
          git diff --name-only HEAD~1 HEAD -- meritoros-theme/ > changed_files.txt
          cat changed_files.txt

      - name: Deploy changed files via FTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          if [ ! -s changed_files.txt ]; then
            echo "No changed files in meritoros-theme/ — skipping deploy"
            exit 0
          fi
          while IFS= read -r file; do
            remote="${file#meritoros-theme/}"
            remote_dir="/public_html/wp-content/themes/meritoros-theme/$(dirname "$remote")"
            echo "Uploading: $file -> /public_html/wp-content/themes/meritoros-theme/$remote"
            lftp -c "
              set net:timeout 30;
              set ftp:ssl-allow no;
              set ftp:passive-mode yes;
              open -u srv104971,$FTP_PASSWORD ftp://h96.seohost.pl;
              mkdir -p $remote_dir;
              put $file -o /public_html/wp-content/themes/meritoros-theme/$remote
            "
          done < changed_files.txt

      - name: Reset OPcache on server
        run: |
          curl -s --max-time 10 "https://meritoros.web-canvas.pl/wp-content/themes/meritoros-theme/opcache-reset.php" || true
          echo "OPcache reset triggered"
